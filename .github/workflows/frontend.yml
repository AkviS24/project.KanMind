name: Frontend checks

permissions:
  contents: read

on:
  push:
    branches:
      - production-preparation
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check modified JavaScript files
        run: |
          node --check shared/js/config.js
          node --check shared/js/api.js
          node --check shared/js/auth.js
